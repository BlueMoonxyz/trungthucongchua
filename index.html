<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071329"><title>Trung Thu vui vẻ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041023;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.stage{position:fixed;inset:-2.5%;overflow:hidden;background:#071329;transform:scale(1.06);transition:transform .16s ease-out;will-change:transform}.backdrop{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(1,8,26,.04),rgba(1,7,18,.18)),url('trung-thu-bg.webp');background-size:cover;background-position:center 52%;filter:saturate(1.06) contrast(1.03)}.backdrop:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,7,25,.02),rgba(0,5,20,.12) 45%,rgba(0,2,10,.4))}.glow{position:absolute;border-radius:50%;filter:blur(30px);opacity:.23;mix-blend-mode:screen;animation:breathe 3.8s ease-in-out infinite alternate}.glow.a{width:17vw;height:17vw;left:4%;bottom:9%;background:#ff5c16}.glow.b{width:17vw;height:17vw;right:4%;bottom:8%;background:#ffb02e;animation-delay:-1.7s}#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wishes{position:absolute;inset:0;overflow:hidden;opacity:.68;pointer-events:none}.wish{position:absolute;color:rgba(255,226,151,.46);font:600 16px Georgia,serif;letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 14px rgba(255,186,65,.5);animation:drift linear infinite}.lyrics{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:7vw;text-align:center;pointer-events:none}#lyric{max-width:980px;margin:0;font:700 clamp(2rem,6.8vw,5.9rem)/1.13 Georgia,serif;letter-spacing:-.025em;text-wrap:balance;color:#fff4c7;text-shadow:0 3px 1px rgba(84,32,5,.8),0 0 18px rgba(255,200,91,.72),0 0 46px rgba(255,145,34,.42),0 8px 28px rgba(0,0,0,.9);opacity:0;transform:translateY(28px) scale(.97);filter:blur(10px);transition:opacity .55s,transform .65s cubic-bezier(.2,.8,.2,1),filter .55s}#lyric.show{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}#progress{position:fixed;z-index:9;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(300px,64vw);height:2px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;opacity:0;transition:opacity .5s}#bar{height:100%;width:0;background:linear-gradient(90deg,#f5a93f,#fff0a5);box-shadow:0 0 10px #ffc65a}#start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:25px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(18,42,83,.3),rgba(1,6,18,.76)),url('trung-thu-bg.webp') center/cover}#start:after{content:"";position:absolute;inset:0;background:rgba(2,7,20,.34);backdrop-filter:blur(4px)}.intro{position:relative;z-index:2;animation:enter 1s ease both}.eyebrow{margin:0 0 13px;color:#ffd675;font-size:.76rem;font-weight:750;letter-spacing:.32em;text-transform:uppercase}.intro h1{margin:0;font:700 clamp(3rem,10vw,7.2rem)/.95 Georgia,serif;color:#fff0af;text-shadow:0 0 34px rgba(255,187,66,.55),0 5px 24px rgba(0,0,0,.75)}.intro p{margin:18px 0 30px;color:rgba(255,244,210,.84)}.start-btn{border:1px solid rgba(255,235,170,.9);border-radius:999px;padding:15px 27px;color:#321700;font-weight:800;background:linear-gradient(#fff0b0,#e9a93e);box-shadow:0 10px 40px rgba(255,164,35,.36);cursor:pointer}.start-btn:active{transform:scale(.97)}.sound{position:fixed;z-index:10;right:17px;top:max(17px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,238,184,.35);background:rgba(3,12,31,.4);color:#ffe596;backdrop-filter:blur(10px);display:none;place-items:center;cursor:pointer}@keyframes drift{0%{transform:translate3d(-15vw,110vh,0) rotate(-5deg);opacity:0}12%{opacity:.7}88%{opacity:.45}100%{transform:translate3d(12vw,-20vh,0) rotate(5deg);opacity:0}}@keyframes breathe{to{opacity:.4;transform:scale(1.15)}}@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:650px){.backdrop{background-position:center}.lyrics{padding:9vw 7vw 24vw}#lyric{font-size:clamp(1.85rem,9.4vw,3.7rem)}.wish{font-size:12px!important}.glow{width:38vw!important;height:38vw!important}.intro h1{font-size:clamp(3.4rem,16vw,5.4rem)}}
</style></head><body>
<main class="stage" id="stage"><div class="backdrop"></div><div class="glow a"></div><div class="glow b"></div><canvas id="sparks"></canvas><div class="wishes" id="wishes"></div><section class="lyrics"><h2 id="lyric"></h2></section></main>
<section id="start"><div class="intro"><p class="eyebrow">Một đêm trăng dành cho bạn</p><h1>Trung Thu<br>vui vẻ</h1><p>Chạm để mở lời chúc ✦</p><button class="start-btn" id="startBtn">Bắt đầu</button></div></section><button class="sound" id="sound">♫</button><div id="progress"><div id="bar"></div></div><audio id="music" src="music.mp3" preload="auto"></audio>
<script>
const cues=[{start:0,end:3,text:'Cứ yêu đi, đừng bận tâm chi ngày sau.'},{start:3,end:7.35,text:'Nơi nào đều có hai ta, chắc chắn sẽ là thiên đường.'},{start:7.35,end:11.9,text:'Chỉ cần được ở bên em, anh bất chấp cho dù đâu.'},{start:11.9,end:17.65,text:'Đổi lại những phút vô tư cho em, hi sinh anh không là vô nghĩa.'},{start:17.65,end:21.1,text:'Hiểu cho anh, vô tư thôi đừng vô tâm!'}];
const wishes=document.querySelector('#wishes');for(let i=0;i<13;i++){const e=document.createElement('span');e.className='wish';e.textContent='Trung Thu vui vẻ';e.style.left=(2+Math.random()*86)+'%';e.style.fontSize=(12+Math.random()*7)+'px';e.style.animationDuration=(13+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*20)+'s';wishes.appendChild(e)}
const audio=document.querySelector('#music'),lyric=document.querySelector('#lyric'),bar=document.querySelector('#bar'),progress=document.querySelector('#progress'),sound=document.querySelector('#sound');let current=-1,raf;
function showCue(i){if(i===current)return;current=i;lyric.classList.remove('show');setTimeout(()=>{lyric.textContent=cues[i]?.text||'Trung Thu vui vẻ ✦';lyric.classList.add('show')},150)}function sync(){const t=audio.currentTime;let i=cues.findIndex(c=>t>=c.start&&t<c.end);if(i<0)i=cues.length-1;showCue(i);bar.style.width=Math.min(100,t/audio.duration*100)+'%';if(!audio.paused)raf=requestAnimationFrame(sync)}
document.querySelector('#startBtn').onclick=async()=>{document.querySelector('#start').style.display='none';sound.style.display='grid';progress.style.opacity='1';showCue(0);try{await audio.play();sync()}catch(e){lyric.textContent='Chạm nút nhạc để bắt đầu';lyric.classList.add('show')}};sound.onclick=()=>{if(audio.paused){audio.play();sync();sound.textContent='♫'}else{audio.pause();cancelAnimationFrame(raf);sound.textContent='×'}};audio.onended=()=>{lyric.classList.remove('show');setTimeout(()=>{lyric.textContent='Trung Thu vui vẻ ✦';lyric.classList.add('show')},180);bar.style.width='100%'};
const stage=document.querySelector('#stage');addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*5,y=(.5-e.clientY/innerHeight)*4;stage.style.transform=`scale(1.06) rotateX(${y}deg) rotateY(${x}deg)`});addEventListener('pointerleave',()=>stage.style.transform='scale(1.06)');
const c=document.querySelector('#sparks'),ctx=c.getContext('2d');let parts=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);parts=Array.from({length:45},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.4+Math.random()*1.4,v:.08+Math.random()*.3,a:.15+Math.random()*.55}))}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of parts){p.y-=p.v;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}ctx.beginPath();ctx.fillStyle=`rgba(255,193,75,${p.a})`;ctx.shadowBlur=10;ctx.shadowColor='#ffb33e';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}addEventListener('resize',size);size();draw();
</script></body></html>
