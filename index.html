<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071329"><title>Trung Thu vui vẻ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Playpen+Sans:wght@600;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041023;color:#fff;font-family:"Be Vietnam Pro",system-ui,sans-serif}button{font:inherit}.stage{position:fixed;inset:-2.5%;overflow:hidden;background:#071329;transform:scale(1.06);transition:transform .16s ease-out;will-change:transform}.backdrop{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(1,8,26,.02),rgba(1,7,18,.14)),url('trung-thu-bg.webp');background-size:cover;background-position:center 52%;filter:saturate(1.15) contrast(1.06) brightness(1.04)}.backdrop:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 12%,rgba(255,225,147,.13),transparent 24%),linear-gradient(180deg,rgba(0,4,15,.02),rgba(0,3,14,.3) 100%);box-shadow:inset 0 0 120px rgba(0,2,12,.46)}.mist{position:absolute;z-index:2;inset:-20%;opacity:.24;filter:blur(34px);background:radial-gradient(ellipse at 18% 28%,rgba(220,230,255,.28),transparent 26%),radial-gradient(ellipse at 68% 18%,rgba(210,224,255,.2),transparent 24%),radial-gradient(ellipse at 48% 55%,rgba(171,199,239,.13),transparent 31%);animation:mistMove 18s ease-in-out infinite alternate;pointer-events:none}.lantern-glints{position:absolute;z-index:2;inset:0;pointer-events:none}.glint{position:absolute;width:clamp(30px,5vw,90px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,245,169,.75),rgba(255,116,20,.24) 30%,transparent 70%);filter:blur(4px);mix-blend-mode:screen;animation:twinkle 1.8s ease-in-out infinite alternate}.glint:nth-child(1){left:4%;top:5%}.glint:nth-child(2){left:20%;top:10%;animation-delay:-.8s}.glint:nth-child(3){right:5%;top:18%;animation-delay:-1.2s}.glint:nth-child(4){right:10%;bottom:27%;animation-delay:-.3s}.glow{position:absolute;border-radius:50%;filter:blur(34px);opacity:.3;mix-blend-mode:screen;animation:breathe 3s ease-in-out infinite alternate}.glow.a{width:19vw;height:19vw;left:3%;bottom:7%;background:#ff4a0d}.glow.b{width:19vw;height:19vw;right:3%;bottom:7%;background:#ffb02e;animation-delay:-1.4s}#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wishes{position:absolute;z-index:3;inset:0;overflow:hidden;pointer-events:none;mask-image:linear-gradient(to bottom,transparent 0,#000 8%,#000 90%,transparent 100%)}.wish{position:absolute;top:-18vh;color:#ffe29a;font:800 16px/1 "Playpen Sans","Be Vietnam Pro",cursive;letter-spacing:.025em;white-space:nowrap;text-shadow:0 2px 2px rgba(91,31,0,.9),0 0 10px rgba(255,176,40,.95),0 0 25px rgba(255,116,20,.6);animation:fall linear infinite;will-change:transform,opacity}.sky-lanterns{position:absolute;z-index:7;inset:0;overflow:hidden;pointer-events:none}.sky-lantern{position:absolute;font-size:clamp(24px,4vw,48px);filter:drop-shadow(0 0 9px #ff9b29) drop-shadow(0 0 22px rgba(255,91,18,.8));animation:lanternFly 5.8s ease-out forwards;will-change:transform,opacity}.lyrics{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:7vw;text-align:center;pointer-events:none}#lyric{max-width:1040px;margin:0;padding:.18em .34em;font:800 clamp(2rem,6.5vw,5.7rem)/1.18 "Playpen Sans","Be Vietnam Pro",cursive;letter-spacing:-.045em;text-wrap:balance;color:#fff5c8;text-shadow:0 3px 1px rgba(84,32,5,.92),0 0 18px rgba(255,200,91,.84),0 0 50px rgba(255,145,34,.5),0 10px 30px rgba(0,0,0,.95);opacity:0;transform:translateY(34px) scale(.95);filter:blur(10px);transition:opacity .4s,transform .52s cubic-bezier(.16,.84,.23,1),filter .4s}#lyric.show{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}.hint{position:fixed;z-index:9;left:50%;bottom:max(40px,calc(env(safe-area-inset-bottom) + 20px));transform:translateX(-50%);margin:0;color:rgba(255,240,190,.76);font-size:.75rem;font-weight:700;letter-spacing:.06em;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none}.hint.show{opacity:1;animation:hintFade 5s 1.4s forwards}#progress{position:fixed;z-index:9;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(340px,64vw);height:3px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;opacity:0;transition:opacity .5s}#bar{height:100%;width:0;background:linear-gradient(90deg,#f29a27,#fff2a7);box-shadow:0 0 13px #ffc65a}#start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:25px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(18,42,83,.18),rgba(1,6,18,.72)),url('trung-thu-bg.webp') center/cover;clip-path:inset(0 0 0 0);transition:clip-path 1s cubic-bezier(.76,0,.24,1),filter .8s}#start.opening{clip-path:inset(0 50% 0 50%);filter:brightness(1.5)}#start:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,7,20,.1),rgba(2,7,20,.38));backdrop-filter:blur(3px)}.intro{position:relative;z-index:2;padding:clamp(26px,5vw,48px);border:1px solid rgba(255,225,142,.22);border-radius:36px;background:radial-gradient(circle at top,rgba(115,44,7,.22),rgba(2,10,29,.28));box-shadow:0 24px 80px rgba(0,0,0,.3);backdrop-filter:blur(8px);animation:enter .8s ease both}.eyebrow{margin:0 0 15px;color:#ffd675;font-size:.78rem;font-weight:800;letter-spacing:.28em;text-transform:uppercase}.intro h1{margin:0;font:800 clamp(3rem,9vw,6.8rem)/1.02 "Playpen Sans","Be Vietnam Pro",cursive;letter-spacing:-.06em;color:#fff0af;text-shadow:0 2px 0 #9a4a13,0 0 34px rgba(255,187,66,.68),0 8px 28px rgba(0,0,0,.8)}.intro p{margin:18px 0 30px;color:rgba(255,246,220,.9);font-weight:600}.start-btn{border:1px solid rgba(255,242,193,.95);border-radius:999px;padding:15px 30px;color:#421d00;font-weight:800;background:linear-gradient(180deg,#fff2b9,#e9a43a);box-shadow:0 10px 36px rgba(255,164,35,.42),inset 0 1px #fff;cursor:pointer;transition:transform .18s,box-shadow .18s}.start-btn:hover{transform:translateY(-2px);box-shadow:0 15px 44px rgba(255,164,35,.52),inset 0 1px #fff}.start-btn:active{transform:scale(.97)}.sound{position:fixed;z-index:10;right:17px;top:max(17px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,238,184,.45);background:rgba(3,12,31,.48);color:#ffe596;backdrop-filter:blur(10px);display:none;place-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.25)}.final-card{position:fixed;z-index:15;left:50%;top:50%;width:min(90vw,620px);padding:clamp(28px,6vw,52px);border:1px solid rgba(255,234,167,.48);border-radius:32px;text-align:center;background:radial-gradient(circle at top,rgba(126,54,10,.54),rgba(3,12,31,.86));box-shadow:0 24px 100px rgba(0,0,0,.68),0 0 55px rgba(255,157,44,.2);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transform:translate(-50%,-45%) scale(.88);transition:opacity .8s,transform .9s cubic-bezier(.16,.84,.23,1)}.final-card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.final-card .moon{font-size:clamp(3rem,8vw,5.5rem);filter:drop-shadow(0 0 22px rgba(255,220,125,.72))}.final-card h2{margin:8px 0 14px;font:800 clamp(2rem,6vw,4rem)/1.15 "Playpen Sans","Be Vietnam Pro",cursive;color:#fff1b8}.final-card p{margin:0;color:#fff8dd;font-size:clamp(1rem,2.2vw,1.25rem);line-height:1.75}.close-card{margin-top:24px;border:1px solid rgba(255,233,166,.6);border-radius:999px;padding:11px 20px;background:rgba(255,230,153,.12);color:#fff1ba;font-weight:700;cursor:pointer}@keyframes fall{0%{transform:translate3d(-4vw,-20vh,0) rotate(-4deg) scale(.92);opacity:0}8%{opacity:.92}85%{opacity:.78}100%{transform:translate3d(7vw,125vh,0) rotate(6deg) scale(1.05);opacity:0}}@keyframes lanternFly{0%{transform:translate(-50%,-10%) scale(.55);opacity:0}12%{opacity:1}70%{opacity:.95}100%{transform:translate(calc(-50% + var(--drift)), -115vh) scale(1.05);opacity:0}}@keyframes mistMove{to{transform:translate3d(9%,2%,0) scale(1.08);opacity:.34}}@keyframes twinkle{from{opacity:.28;transform:scale(.78)}to{opacity:.88;transform:scale(1.18)}}@keyframes hintFade{70%{opacity:1}100%{opacity:0}}@keyframes breathe{to{opacity:.48;transform:scale(1.18)}}@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@media(max-width:650px){.stage{inset:-1.5%;transform:scale(1.04)}.backdrop{background-position:center}.lyrics{padding:12vw 7vw 25vw}#lyric{font-size:clamp(1.8rem,8.9vw,3.5rem);letter-spacing:-.035em}.wish{font-size:13px!important}.glow{width:38vw!important;height:38vw!important}.intro{width:min(92vw,460px);padding:28px 20px;border-radius:28px}.intro h1{font-size:clamp(3rem,14.5vw,5rem)}.hint{font-size:.68rem}}@media(prefers-reduced-motion:reduce){.glow,.wish,.intro,.mist,.glint{animation-duration:.01ms!important;animation-iteration-count:1!important}.stage{transition:none}}
</style></head><body>
<main class="stage" id="stage"><div class="backdrop"></div><div class="mist"></div><div class="lantern-glints"><i class="glint"></i><i class="glint"></i><i class="glint"></i><i class="glint"></i></div><div class="glow a"></div><div class="glow b"></div><canvas id="sparks"></canvas><div class="wishes" id="wishes"></div><div class="sky-lanterns" id="skyLanterns"></div><section class="lyrics"><h2 id="lyric"></h2></section></main>
<section id="start"><div class="intro"><p class="eyebrow">Một đêm trăng dành cho bạn</p><h1>Trung Thu<br>vui vẻ</h1><p>Chạm để mở lời chúc ✦</p><button class="start-btn" id="startBtn">Bắt đầu</button></div></section><button class="sound" id="sound">♫</button><div id="progress"><div id="bar"></div></div><audio id="music" src="music.mp3" preload="auto"></audio>
<p class="hint" id="hint">Chạm vào bầu trời để thả đèn ước nguyện 🏮</p><aside class="final-card" id="finalCard" aria-live="polite"><div class="moon">🌕</div><h2>Trung Thu vui vẻ</h2><p>Chúc bạn một mùa Trung Thu<br>bình an, đoàn viên và thật nhiều niềm vui.</p><button class="close-card" id="closeCard">Ngắm trăng tiếp</button></aside>
<script>
const cues=[{start:0,end:3,text:'Cứ yêu đi, đừng bận tâm chi ngày sau.'},{start:3,end:7.35,text:'Nơi nào đều có hai ta, chắc chắn sẽ là thiên đường.'},{start:7.35,end:11.9,text:'Chỉ cần được ở bên em, anh bất chấp cho dù đâu.'},{start:11.9,end:17.65,text:'Đổi lại những phút vô tư cho em, hi sinh anh không là vô nghĩa.'},{start:17.65,end:21.1,text:'Hiểu cho anh, vô tư thôi đừng vô tâm!'}];
const wishes=document.querySelector('#wishes');for(let i=0;i<22;i++){const e=document.createElement('span');e.className='wish';e.textContent='Trung Thu vui vẻ ✦';e.style.left=(-3+Math.random()*92)+'%';e.style.fontSize=(13+Math.random()*10)+'px';e.style.animationDuration=(4.2+Math.random()*3.6)+'s';e.style.animationDelay=(-Math.random()*8)+'s';e.style.opacity=(.58+Math.random()*.36).toFixed(2);wishes.appendChild(e)}
const audio=document.querySelector('#music'),lyric=document.querySelector('#lyric'),bar=document.querySelector('#bar'),progress=document.querySelector('#progress'),sound=document.querySelector('#sound'),start=document.querySelector('#start'),hint=document.querySelector('#hint'),finalCard=document.querySelector('#finalCard'),skyLanterns=document.querySelector('#skyLanterns');let current=-1,raf,started=false;
function showCue(i){if(i===current)return;current=i;lyric.classList.remove('show');setTimeout(()=>{lyric.textContent=cues[i]?.text||'Trung Thu vui vẻ ✦';lyric.classList.add('show')},150)}function sync(){const t=audio.currentTime;let i=cues.findIndex(c=>t>=c.start&&t<c.end);if(i<0)i=cues.length-1;showCue(i);bar.style.width=Math.min(100,t/audio.duration*100)+'%';if(!audio.paused)raf=requestAnimationFrame(sync)}
document.querySelector('#startBtn').onclick=async()=>{started=true;start.classList.add('opening');sound.style.display='grid';progress.style.opacity='1';hint.classList.add('show');showCue(0);setTimeout(()=>start.style.display='none',950);try{await audio.play();sync()}catch(e){lyric.textContent='Chạm nút nhạc để bắt đầu';lyric.classList.add('show')}};sound.onclick=e=>{e.stopPropagation();if(audio.paused){audio.play();sync();sound.textContent='♫'}else{audio.pause();cancelAnimationFrame(raf);sound.textContent='×'}};audio.onended=()=>{lyric.classList.remove('show');setTimeout(()=>{lyric.textContent='Trung Thu vui vẻ ✦';lyric.classList.add('show');finalCard.classList.add('show')},500);bar.style.width='100%'};document.querySelector('#closeCard').onclick=e=>{e.stopPropagation();finalCard.classList.remove('show')};
function releaseLantern(x,y){const e=document.createElement('span');e.className='sky-lantern';e.textContent='🏮';e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--drift',(Math.random()*140-70)+'px');skyLanterns.appendChild(e);setTimeout(()=>e.remove(),6000)}
document.addEventListener('pointerdown',e=>{if(!started||e.target.closest('button')||finalCard.classList.contains('show'))return;releaseLantern(e.clientX,e.clientY)});
const stage=document.querySelector('#stage');addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*5,y=(.5-e.clientY/innerHeight)*4;stage.style.transform=`scale(1.06) rotateX(${y}deg) rotateY(${x}deg)`});addEventListener('pointerleave',()=>stage.style.transform='scale(1.06)');
const c=document.querySelector('#sparks'),ctx=c.getContext('2d');let parts=[];function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);parts=Array.from({length:45},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.4+Math.random()*1.4,v:.08+Math.random()*.3,a:.15+Math.random()*.55}))}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of parts){p.y-=p.v;if(p.y<-5){p.y=innerHeight+5;p.x=Math.random()*innerWidth}ctx.beginPath();ctx.fillStyle=`rgba(255,193,75,${p.a})`;ctx.shadowBlur=10;ctx.shadowColor='#ffb33e';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}addEventListener('resize',size);size();draw();
</script></body></html>
